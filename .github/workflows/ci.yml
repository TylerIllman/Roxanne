name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frontend dependencies
        run: npm install

      - name: Install backend test dependencies
        run: python -m pip install -e "./apps/backend[test]"

      - name: Run backend tests
        run: python -m pytest apps/backend/tests -m "not slow and not integration"

      - name: Type-check desktop app
        run: npm --workspace apps/desktop run lint

      - name: Build desktop app
        run: npm --workspace apps/desktop run build
