[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roxanne-backend"
version = "0.1.4"
description = "Backend services for the Roxanne personal research copilot"
requires-python = ">=3.9"
dependencies = [
  "aiofiles>=24.1.0",
  "anthropic>=0.43.0",
  "certifi",
  "chromadb>=0.5.5",
  "fastapi>=0.115.0",
  "fastembed>=0.5.0",
  "vosk>=0.3.44",
  "httpx>=0.28.1",
  "keyring>=25.6.0",
  "openai>=1.0.0",
  "orjson>=3.10.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "pymupdf>=1.24.0",
  "python-multipart>=0.0.20",
  "rapidfuzz>=3.10.0",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.28.1",
]
build = [
  "pyinstaller>=6.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "slow: marks tests that download models or hit real APIs",
  "integration: marks tests requiring external services (Zotero, Ollama)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["roxanne_backend*"]
